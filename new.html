<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发帖 · BCSIMP 论坛</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="section-title">发新帖</div>
  <div class="card">
    <div class="form-group">
      <label>标题</label>
      <input id="title" maxlength="100">
    </div>
    <div class="form-group">
      <label>内容</label>
      <textarea id="content" maxlength="10000"></textarea>
    </div>
    <div class="form-group">
      <label>附件（可多选，每个 ≤ 500MB）</label>
      <input type="file" id="file" multiple>
      <button class="btn secondary" id="uploadBtn" style="margin-top:8px">上传选中的文件</button>
      <div id="uploadStatus" style="font-size:13px;color:#888;margin-top:8px"></div>
      <div id="progressWrap" style="display:none;margin-top:10px">
        <div style="background:#333;height:6px;border-radius:3px;overflow:hidden">
          <div id="progressBar" style="background:#00ffc8;height:100%;width:0%;transition:width 0.2s"></div>
        </div>
        <div id="progressText" style="font-size:12px;color:#666;margin-top:6px"></div>
      </div>
      <div id="attachmentList" style="margin-top:12px"></div>
    </div>
    <button class="btn" id="submit">发表（需审核）</button>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
let attachments = [];

async function init() {
  await buildNav();
  if (!getToken()) location.href = '/login.html';
}

document.getElementById('uploadBtn').onclick = async () => {
  const files = Array.from(document.getElementById('file').files);
  if (files.length === 0) { toast('先选文件', true); return; }

  const status = document.getElementById('uploadStatus');
  const wrap = document.getElementById('progressWrap');
  const bar = document.getElementById('progressBar');
  const txt = document.getElementById('progressText');

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 500 * 1024 * 1024) { toast(f.name + ' 超过 500MB，跳过', true); continue; }

    status.textContent = '上传中 (' + (i+1) + '/' + files.length + ')：' + f.name;
    wrap.style.display = 'block';
    bar.style.width = '0%';
    txt.textContent = '0%';

    try {
      // 1. 拿预签名 URL
      const r = await fetch(API_BASE + '/api/upload-url', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + getToken(),
          'X-Client': 'web',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name: f.name, size: f.size, type: f.type })
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || '获取上传地址失败');

      // 2. 直传 B2
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', data.uploadUrl, true);
        xhr.setRequestHeader('Content-Type', f.type || 'application/octet-stream');
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round(e.loaded / e.total * 100);
            bar.style.width = pct + '%';
            txt.textContent = pct + '% (' + (e.loaded/1024/1024).toFixed(1) + 'MB / ' + (e.total/1024/1024).toFixed(1) + 'MB)';
          }
        };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve();
          else reject(new Error('B2 返回 ' + xhr.status));
        };
        xhr.onerror = () => reject(new Error('网络错误或 CORS 被拦'));
        xhr.send(f);
      });

      // 3. 通知完成
      const r2 = await fetch(API_BASE + '/api/upload-done', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + getToken(),
          'X-Client': 'web',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ id: data.id })
      });
      const d2 = await r2.json();
      if (!d2.ok) throw new Error(d2.error || '通知失败');

      attachments.push({ id: data.id, name: f.name, size: f.size, type: f.type });
    } catch (err) {
      toast(f.name + ' 上传失败：' + err.message, true);
    }
  }

  status.textContent = '✅ 全部完成，共 ' + attachments.length + ' 个附件';
  wrap.style.display = 'none';
  document.getElementById('file').value = '';
  renderAttachments();
};

function renderAttachments() {
  const box = document.getElementById('attachmentList');
  if (attachments.length === 0) { box.innerHTML = ''; return; }
  box.innerHTML = '<div style="font-size:13px;color:#aaa;margin-bottom:8px">已上传附件：</div>' +
    attachments.map((a, i) =>
      '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">' +
        '<span style="flex:1;font-size:13px">📎 ' + escapeHtml(a.name) + ' (' + (a.size/1024).toFixed(1) + ' KB)</span>' +
        '<button class="btn danger" style="padding:4px 10px;font-size:12px" onclick="removeAttachment(' + i + ')">移除</button>' +
      '</div>'
    ).join('');
}

function removeAttachment(i) {
  attachments.splice(i, 1);
  renderAttachments();
}

document.getElementById('submit').onclick = async () => {
  const t = document.getElementById('title').value.trim();
  const c = document.getElementById('content').value.trim();
  if (!t || !c) { toast('标题和内容都填', true); return; }
  const r = await fetch(API_BASE + '/api/posts', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + getToken(),
      'X-Client': 'web',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ title: t, content: c, attachments: attachments.map(a => a.id) })
  });
  const d = await r.json();
  if (d.ok) { toast(d.message || '已提交'); setTimeout(() => location.href = '/index.html', 800); }
  else { toast(d.error || '失败', true); }
};

init();
</script>
</body>
</html>
