<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发帖 · BCSIMP 论坛</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="section-title">发新帖</div>
  <div class="card">
    <div class="form-group">
      <label>标题</label>
      <input id="title" maxlength="100">
    </div>
    <div class="form-group">
      <label>内容</label>
      <textarea id="content" maxlength="10000"></textarea>
    </div>
    <div class="form-group">
      <label>上传文件（≤ 500MB）</label>
      <input type="file" id="file">
      <div id="uploadStatus" style="font-size:13px;color:#888;margin-top:6px"></div>
      <div id="progressWrap" style="display:none;margin-top:10px">
        <div style="background:#333;height:6px;border-radius:3px;overflow:hidden">
          <div id="progressBar" style="background:#00ffc8;height:100%;width:0%;transition:width 0.2s"></div>
        </div>
        <div id="progressText" style="font-size:12px;color:#666;margin-top:6px"></div>
      </div>
    </div>
    <button class="btn secondary" id="uploadBtn">上传到内容</button>
    <button class="btn" id="submit" style="margin-left:10px">发表（需审核）</button>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
async function init() {
  await buildNav();
  if (!getToken()) location.href = '/login.html';
}

document.getElementById('uploadBtn').onclick = async () => {
  const f = document.getElementById('file').files[0];
  if (!f) { toast('先选个文件', true); return; }
  if (f.size > 500 * 1024 * 1024) { toast('文件超过 500MB', true); return; }

  const status = document.getElementById('uploadStatus');
  const wrap = document.getElementById('progressWrap');
  const bar = document.getElementById('progressBar');
  const txt = document.getElementById('progressText');

  status.textContent = '准备中...';
  wrap.style.display = 'block';
  bar.style.width = '0%';
  txt.textContent = '0%';

  const r = await fetch(API_BASE + '/api/upload-url', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + getToken(),
      'X-Client': 'web',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ name: f.name, size: f.size, type: f.type })
  });
  const data = await r.json();
  if (!data.ok) {
    status.textContent = '❌ ' + (data.error || '获取上传地址失败');
    toast(data.error || '失败', true);
    return;
  }

  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', data.uploadUrl, true);
    xhr.setRequestHeader('Content-Type', f.type || 'application/octet-stream');

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round(e.loaded / e.total * 100);
        bar.style.width = pct + '%';
        txt.textContent = pct + '% (' + (e.loaded/1024/1024).toFixed(1) + 'MB / ' + (e.total/1024/1024).toFixed(1) + 'MB)';
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error('B2 返回 ' + xhr.status + ': ' + xhr.responseText.slice(0, 120)));
    };
    xhr.onerror = () => reject(new Error('网络错误或 CORS 被拦'));
    xhr.send(f);
  }).then(async () => {
    const r2 = await fetch(API_BASE + '/api/upload-done', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + getToken(),
        'X-Client': 'web',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ id: data.id })
    });
    const d2 = await r2.json();
    if (!d2.ok) throw new Error(d2.error || '通知失败');

    const fullUrl = API_BASE + d2.url;
    const ta = document.getElementById('content');
    if (f.type.startsWith('image/')) {
      ta.value += '\n![图片](' + fullUrl + ')\n';
    } else {
      ta.value += '\n[文件](' + fullUrl + ')\n';
    }
    status.innerHTML = '✅ 已插入：<a href="' + fullUrl + '" target="_blank">' + escapeHtml(f.name) + '</a>';
    toast('上传成功');
    document.getElementById('file').value = '';
    setTimeout(() => { wrap.style.display = 'none'; }, 1500);
  }).catch(err => {
    status.textContent = '❌ ' + err.message;
    toast(err.message, true);
  });
};

document.getElementById('submit').onclick = async () => {
  const t = document.getElementById('title').value.trim();
  const c = document.getElementById('content').value.trim();
  if (!t || !c) { toast('标题和内容都填', true); return; }
  const r = await API.createPost(t, c);
  if (r.ok) { toast(r.message || '已提交'); setTimeout(() => location.href = '/index.html', 800); }
  else { toast(r.error || '失败', true); }
};

init();
</script>
</body>
</html>
