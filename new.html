<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发帖 · BCSIMP 论坛</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="section-title">发新帖</div>
  <div class="card">
    <div class="form-group">
      <label>标题</label>
      <input id="title" maxlength="100">
    </div>
    <div class="form-group">
      <label>内容</label>
      <textarea id="content" maxlength="10000"></textarea>
    </div>
    <div class="form-group">
      <label>附件（每个 ≤ 100MB）</label>
      <input type="file" id="file" multiple>
      <button class="btn secondary" id="uploadBtn" style="margin-top:8px">上传选中的文件</button>
      <div id="uploadStatus" style="font-size:13px;color:#888;margin-top:8px"></div>
      <div id="attachmentList" style="margin-top:12px"></div>
    </div>
    <button class="btn" id="submit">发表（需审核）</button>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
let attachments = [];

async function init() {
  await buildNav();
  if (!getToken()) location.href = '/login.html';
}

document.getElementById('uploadBtn').onclick = async () => {
  const files = Array.from(document.getElementById('file').files);
  if (files.length === 0) { toast('先选文件', true); return; }
  const status = document.getElementById('uploadStatus');

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 100 * 1024 * 1024) { toast(f.name + ' 超过 100MB，跳过', true); continue; }
    status.textContent = '上传中 (' + (i+1) + '/' + files.length + ')：' + f.name;
    try {
      const fd = new FormData();
      fd.append('file', f);
      fd.append('filename', f.name);
      fd.append('filetype', f.type || 'application/octet-stream');
      const r = await fetch(API_BASE + '/api/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + getToken(), 'X-Client': 'web' },
        body: fd
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || '失败');
      attachments.push({ id: data.id, name: data.name, size: data.size, type: data.type, url: API_BASE + data.url });
    } catch (err) {
      toast(f.name + ' 失败：' + err.message, true);
    }
  }

  status.textContent = '✅ 全部完成，共 ' + attachments.length + ' 个附件';
  document.getElementById('file').value = '';
  renderAttachments();
};

function renderAttachments() {
  const box = document.getElementById('attachmentList');
  if (attachments.length === 0) { box.innerHTML = ''; return; }
  box.innerHTML = '<div style="font-size:13px;color:#aaa;margin-bottom:8px">已上传附件：</div>' +
    attachments.map((a, i) => {
      const isImg = (a.type || '').startsWith('image/');
      return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);flex-wrap:wrap">' +
        (isImg ? '<img src="' + a.url + '" style="width:60px;height:60px;object-fit:cover;border-radius:4px">' : '') +
        '<span style="flex:1;font-size:13px;min-width:120px">📎 ' + escapeHtml(a.name) + ' (' + (a.size/1024).toFixed(1) + ' KB)</span>' +
        '<button class="btn secondary" style="padding:4px 10px;font-size:12px" onclick="insertMarkdown(' + i + ')">插入正文</button>' +
        '<button class="btn danger" style="padding:4px 10px;font-size:12px" onclick="removeAttachment(' + i + ')">移除</button>' +
      '</div>';
    }).join('');
}

function insertMarkdown(i) {
  const a = attachments[i];
  const ta = document.getElementById('content');
  const isImg = (a.type || '').startsWith('image/');
  ta.value += isImg ? ('\n![图片](' + a.url + ')\n') : ('\n[文件](' + a.url + ')\n');
  toast('已插入正文');
}

function removeAttachment(i) { attachments.splice(i, 1); renderAttachments(); }

document.getElementById('submit').onclick = async () => {
  const t = document.getElementById('title').value.trim();
  const c = document.getElementById('content').value.trim();
  if (!t || !c) { toast('标题和内容都填', true); return; }
  const r = await fetch(API_BASE + '/api/posts', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + getToken(), 'X-Client': 'web', 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: t, content: c, attachments: attachments.map(a => a.id) })
  });
  const d = await r.json();
  if (d.ok) { toast(d.message || '已提交'); setTimeout(() => location.href = '/index.html', 800); }
  else { toast(d.error || '失败', true); }
};

init();
</script>
</body>
</html>
