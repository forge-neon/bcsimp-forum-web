<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上传文件 · BCSIMP 论坛</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="section-title">上传文件</div>
  <div class="card">
    <div class="form-group">
      <label>选择文件（每个 ≤ 100MB）</label>
      <input type="file" id="file" multiple>
      <div id="uploadStatus" style="font-size:13px;color:#888;margin-top:6px"></div>
    </div>
    <button class="btn" id="uploadBtn">上传</button>
    <div id="result" style="margin-top:20px"></div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
async function init() {
  await buildNav();
  if (!getToken()) location.href = '/login.html';
}

document.getElementById('uploadBtn').onclick = async () => {
  const files = Array.from(document.getElementById('file').files);
  if (files.length === 0) { toast('先选文件', true); return; }

  const status = document.getElementById('uploadStatus');
  const resultBox = document.getElementById('result');
  resultBox.innerHTML = '';

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 100 * 1024 * 1024) { toast(f.name + ' 超过 100MB，跳过', true); continue; }
    status.textContent = '上传中 (' + (i+1) + '/' + files.length + ')：' + f.name;
    try {
      const fd = new FormData();
      fd.append('file', f);
      fd.append('filename', f.name);
      fd.append('filetype', f.type || 'application/octet-stream');
      const r = await fetch(API_BASE + '/api/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + getToken(), 'X-Client': 'web' },
        body: fd
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || '失败');

      const fullUrl = API_BASE + data.url;
      const isImg = (data.type || '').startsWith('image/');
      const card = document.createElement('div');
      card.style.cssText = 'margin-top:16px;padding:12px;background:rgba(20,20,35,0.6);border-radius:8px';
      card.innerHTML =
        '<div style="font-size:14px;color:#fff;margin-bottom:8px">📎 ' + escapeHtml(data.name) + ' (' + (data.size/1024).toFixed(1) + ' KB)</div>' +
        (isImg ? '<img src="' + fullUrl + '" style="max-width:100%;border-radius:6px;margin-bottom:10px">' : '') +
        '<div style="background:#000;padding:10px;border-radius:6px;word-break:break-all;font-size:12px;margin-bottom:10px">' + escapeHtml(fullUrl) + '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<a class="btn" style="padding:8px 16px;font-size:13px" href="' + fullUrl + '" target="_blank" download>⬇ 打开/下载</a>' +
          '<button class="btn secondary" style="padding:8px 16px;font-size:13px">复制链接</button>' +
        '</div>';
      card.querySelector('button').onclick = () => {
        navigator.clipboard.writeText(fullUrl).then(() => toast('已复制'));
      };
      resultBox.appendChild(card);
    } catch (err) {
      toast(f.name + ' 失败：' + err.message, true);
    }
  }

  status.textContent = '✅ 全部完成';
  document.getElementById('file').value = '';
};

init();
</script>
</body>
</html>
