<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · BCSIMP 论坛</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container" style="max-width:420px;margin-top:80px">
  <div class="section-title" id="title">登录</div>
  <div class="card">
    <div class="form-group"><label>用户名</label><input id="username" autocomplete="username"></div>
    <div class="form-group"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div>
    <div class="btn-row">
      <button class="btn" id="submit">登录</button>
      <button class="btn secondary" id="switch">去注册</button>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
let mode = 'login';
document.getElementById('switch').onclick = () => {
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('title').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('submit').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('switch').textContent = mode === 'login' ? '去注册' : '去登录';
};
document.getElementById('submit').onclick = async () => {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) { toast('请填完整', true); return; }
  const r = mode === 'login' ? await API.login(u, p) : await API.register(u, p);
  if (r.ok) {
    if (mode === 'login') {
      setToken(r.token);
      toast('登录成功');
      setTimeout(() => location.href = '/index.html', 600);
    } else {
      toast(r.message || '注册成功');
      if (r.isAdmin) { setTimeout(() => location.href = '/login.html', 800); }
      else {
        mode = 'login';
        document.getElementById('title').textContent = '登录';
        document.getElementById('submit').textContent = '登录';
        document.getElementById('switch').textContent = '去注册';
      }
    }
  } else { toast(r.error || '失败', true); }
};
</script>
</body>
</html>
