<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帖子 · BCSIMP 论坛</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div id="postBox"><div class="empty">加载中...</div></div>
  <div class="section-title" style="margin-top:40px">回复</div>
  <div id="replies"></div>
  <div class="card" id="replyForm" style="display:none">
    <div class="form-group"><textarea id="replyContent" placeholder="写回复..." style="min-height:100px"></textarea></div>
    <div class="form-group">
      <label>附件（可选，≤ 500MB）</label>
      <input type="file" id="replyFile" multiple>
      <button class="btn secondary" id="replyUploadBtn" style="margin-top:8px">上传附件</button>
      <div id="replyUploadStatus" style="font-size:13px;color:#888;margin-top:8px"></div>
      <div id="replyAttachmentList" style="margin-top:12px"></div>
    </div>
    <button class="btn" id="submitReply">发表回复</button>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
const pid = parseInt(new URLSearchParams(location.search).get('id') || '0');
let replyAttachments = [];

function renderContent(text) {
  let html = escapeHtml(text);
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
    '<img src="$2" style="max-width:100%;border-radius:6px;margin:10px 0;display:block">');
  html = html.replace(/\[文件\]\(([^)]+)\)/g,
    '<a href="$1" target="_blank" style="display:inline-block;padding:12px 24px;background:linear-gradient(90deg,#00ffc8,#00b3ff);color:#000;font-weight:bold;border-radius:8px;text-decoration:none;margin:10px 0">⬇ 点击下载</a>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
    '<a href="$2" target="_blank" style="color:#00ffc8">$1</a>');
  return html;
}

function renderAttachments(atts) {
  if (!atts || atts.length === 0) return '';
  return '<div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)">' +
    '<div style="font-size:12px;color:#888;margin-bottom:8px">附件</div>' +
    atts.map(a =>
      '<a href="' + API_BASE + a.url + '" target="_blank" download style="display:inline-block;padding:10px 20px;background:linear-gradient(90deg,#00ffc8,#00b3ff);color:#000;font-weight:bold;border-radius:8px;text-decoration:none;margin:5px 8px 5px 0;font-size:13px">⬇ ' + escapeHtml(a.name) + '</a>'
    ).join('') +
  '</div>';
}

async function loadPost() {
  const box = document.getElementById('postBox');
  const r = await API.post(pid);
  if (!r.ok) { box.innerHTML = '<div class="empty">帖子不存在或未审核</div>'; return; }
  const p = r.post;
  box.innerHTML =
    '<div class="section-title">' + escapeHtml(p.title) + '</div>' +
    '<div class="card">' +
      '<div style="font-size:12px;color:#666;margin-bottom:16px">' + escapeHtml(p.username || '匿名') + ' · ' + formatTime(p.created_at) + '</div>' +
      '<div style="line-height:1.8;white-space:pre-wrap">' + renderContent(p.content) + '</div>' +
      renderAttachments(p.attachments) +
    '</div>';
}

async function loadReplies() {
  const box = document.getElementById('replies');
  const r = await API.replies(pid);
  if (!r.ok || !r.replies || r.replies.length === 0) {
    box.innerHTML = '<div class="empty" style="padding:30px">还没有回复</div>';
    return;
  }
  box.innerHTML = r.replies.map(x =>
    '<div class="reply">' +
      '<div class="head">' + escapeHtml(x.username || '匿名') + ' · ' + formatTime(x.created_at) + '</div>' +
      '<div class="body">' + renderContent(x.content) + '</div>' +
      renderAttachments(x.attachments) +
    '</div>'
  ).join('');
}

async function init() {
  await buildNav();
  if (getToken()) {
    const me = await API.me();
    if (me.ok) document.getElementById('replyForm').style.display = 'block';
  }
  loadPost();
  loadReplies();
}

document.getElementById('replyUploadBtn').onclick = async () => {
  const files = Array.from(document.getElementById('replyFile').files);
  if (files.length === 0) { toast('先选文件', true); return; }
  const status = document.getElementById('replyUploadStatus');

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 500 * 1024 * 1024) { toast(f.name + ' 超过 500MB，跳过', true); continue; }
    status.textContent = '上传中 (' + (i+1) + '/' + files.length + ')：' + f.name;
    try {
      const r = await fetch(API_BASE + '/api/upload-url', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + getToken(), 'X-Client': 'web', 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: f.name, size: f.size, type: f.type })
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || '失败');

      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', data.uploadUrl, true);
        xhr.setRequestHeader('Content-Type', f.type || 'application/octet-stream');
        xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('B2 ' + xhr.status));
        xhr.onerror = () => reject(new Error('网络错误或 CORS'));
        xhr.send(f);
      });

      const r2 = await fetch(API_BASE + '/api/upload-done', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + getToken(), 'X-Client': 'web', 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: data.id })
      });
      const d2 = await r2.json();
      if (!d2.ok) throw new Error(d2.error || '通知失败');

      replyAttachments.push({ id: data.id, name: f.name, size: f.size });
    } catch (err) {
      toast(f.name + ' 失败：' + err.message, true);
    }
  }
  status.textContent = '✅ 共 ' + replyAttachments.length + ' 个附件';
  renderReplyAttachments();
};

function renderReplyAttachments() {
  const box = document.getElementById('replyAttachmentList');
  if (replyAttachments.length === 0) { box.innerHTML = ''; return; }
  box.innerHTML = '<div style="font-size:13px;color:#aaa;margin-bottom:8px">已上传：</div>' +
    replyAttachments.map((a, i) =>
      '<div style="display:flex;align-items:center;gap:10px;padding:6px 0">' +
        '<span style="flex:1;font-size:13px">📎 ' + escapeHtml(a.name) + '</span>' +
        '<button class="btn danger" style="padding:4px 10px;font-size:12px" onclick="removeReplyAtt(' + i + ')">移除</button>' +
      '</div>'
    ).join('');
}

function removeReplyAtt(i) {
  replyAttachments.splice(i, 1);
  renderReplyAttachments();
}

document.getElementById('submitReply').onclick = async () => {
  const c = document.getElementById('replyContent').value.trim();
  if (!c) { toast('写点什么', true); return; }
  const r = await fetch(API_BASE + '/api/replies', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + getToken(), 'X-Client': 'web', 'Content-Type': 'application/json' },
    body: JSON.stringify({ post_id: pid, content: c, attachments: replyAttachments.map(a => a.id) })
  });
  const d = await r.json();
  if (d.ok) {
    toast(d.message || '已提交');
    document.getElementById('replyContent').value = '';
    replyAttachments = [];
    renderReplyAttachments();
  } else { toast(d.error || '失败', true); }
};

init();
</script>
</body>
</html>
