<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件库 · BCSIMP 论坛</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="section-title">我的文件</div>
  <div id="list"><div class="empty">加载中...</div></div>
</div>
<script src="/js/api.js"></script>
<script>
async function init() {
  await buildNav();
  if (!getToken()) { location.href = '/login.html'; return; }
  load();
}

async function load() {
  const box = document.getElementById('list');
  const r = await fetch(API_BASE + '/api/admin/files', {
    headers: { 'Authorization': 'Bearer ' + getToken(), 'X-Client': 'web' }
  });
  const data = await r.json();

  if (!data.ok || !data.files || data.files.length === 0) {
    box.innerHTML = '<div class="empty">暂无文件</div>';
    return;
  }

  box.innerHTML = data.files.map(f => {
    const url = API_BASE + '/api/file/' + f.id;
    const size = (f.size / 1024).toFixed(1) + ' KB';
    return '<div class="card">' +
      '<div style="font-size:15px;color:#fff;margin-bottom:6px">' + escapeHtml(f.name) + '</div>' +
      '<div style="font-size:12px;color:#666;margin-bottom:10px">' + size + ' · ' + f.storage.toUpperCase() + ' · ' + formatTime(f.created_at) + '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<a class="btn" style="padding:6px 14px;font-size:12px" href="' + url + '" target="_blank">打开</a>' +
        '<button class="btn secondary" style="padding:6px 14px;font-size:12px" onclick="copyUrl(\'' + url + '\')">复制链接</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function copyUrl(u) {
  navigator.clipboard.writeText(u).then(() => toast('已复制'));
}

init();
</script>
</body>
</html>
